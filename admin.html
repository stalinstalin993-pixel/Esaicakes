<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ESAI CAKES Admin</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body class="bg-cream text-cocoa font-sans antialiased min-h-screen">

  <!-- Sign in -->
  <main id="login-view" class="hidden min-h-screen flex items-center justify-center px-4">
    <form id="login-form" class="w-full max-w-sm bg-white rounded-3xl shadow-lg border border-pink-100 p-6 space-y-4">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="" class="w-12 h-12 rounded-full border-2 border-amber-300 object-contain" />
        <div>
          <h1 class="font-serif font-black text-xl leading-tight">ESAI CAKES</h1>
          <p class="text-xs text-gray-500">Admin sign in</p>
        </div>
      </div>
      <div>
        <label for="login-email" class="block text-sm font-semibold mb-1">Email</label>
        <input id="login-email" type="email" required autocomplete="username" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white" />
      </div>
      <div>
        <label for="login-password" class="block text-sm font-semibold mb-1">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white" />
      </div>
      <p id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2"></p>
      <button id="login-btn" type="submit" class="w-full bg-rose hover:bg-pink-700 text-white font-bold py-3.5 rounded-xl shadow transition disabled:opacity-60">Sign in</button>
    </form>
  </main>

  <!-- Cake manager -->
  <div id="app-view" class="hidden">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-pink-100 shadow-sm">
      <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <img src="images/logo.png" alt="" class="w-9 h-9 rounded-full border-2 border-amber-300 object-contain" />
          <span class="font-serif font-black text-lg leading-tight truncate">Cake Admin</span>
        </div>
        <div class="flex items-center gap-2 text-sm font-semibold shrink-0">
          <a href="index.html" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-full border border-pink-200 bg-pink-50 hover:bg-pink-100 transition">View site</a>
          <button id="logout-btn" type="button" class="px-3 py-1.5 rounded-full text-gray-500 hover:text-rose transition">Sign out</button>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-4 pb-24">
      <div class="flex flex-col sm:flex-row gap-2.5 mb-4">
        <input id="search" type="search" placeholder="Search cakes..." class="flex-1 rounded-xl border border-gray-300 px-4 py-2.5 text-base focus:outline-none focus:border-rose bg-white" />
        <select id="filter-category" class="rounded-xl border border-gray-300 px-3 py-2.5 text-base focus:outline-none focus:border-rose bg-white"></select>
        <button id="add-btn" type="button" class="bg-rose hover:bg-pink-700 text-white font-bold px-5 py-2.5 rounded-xl shadow transition whitespace-nowrap">+ Add cake</button>
      </div>
      <p id="list-status" class="text-sm text-gray-500 mb-3"></p>
      <ul id="cake-list" class="space-y-2.5"></ul>
    </main>
  </div>

  <!-- Add / edit cake -->
  <div id="editor" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center">
    <form id="cake-form" class="bg-white w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 id="editor-title" class="font-serif font-bold text-xl">Edit cake</h2>
        <button id="editor-close" type="button" class="text-gray-400 hover:text-rose p-2 -mr-2 text-2xl leading-none" aria-label="Close">&times;</button>
      </div>

      <div>
        <span class="block text-sm font-semibold mb-1.5">Photo</span>
        <div class="flex items-center gap-3">
          <img id="photo-preview" src="images/logo.png" alt="" class="w-24 h-24 rounded-xl object-cover border border-pink-100 bg-pink-50 shrink-0" />
          <div class="min-w-0">
            <label for="photo-input" class="inline-block cursor-pointer bg-pink-50 hover:bg-pink-100 border border-pink-200 text-sm font-bold px-4 py-2 rounded-xl transition">Choose photo</label>
            <input id="photo-input" type="file" accept="image/*" class="hidden" />
            <p id="photo-hint" class="text-xs text-gray-500 mt-1.5">Square photos look best. Large photos are shrunk automatically.</p>
          </div>
        </div>
      </div>

      <div>
        <label for="f-name" class="block text-sm font-semibold mb-1">Cake name</label>
        <input id="f-name" type="text" required maxlength="80" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white" />
      </div>

      <div>
        <label for="f-category" class="block text-sm font-semibold mb-1">Category</label>
        <select id="f-category" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white"></select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="f-price" class="block text-sm font-semibold mb-1">Price (&#8377;)</label>
          <input id="f-price" type="number" inputmode="numeric" min="1" step="1" required class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white" />
        </div>
        <div>
          <label for="f-unit" class="block text-sm font-semibold mb-1">Per</label>
          <input id="f-unit" type="text" maxlength="20" placeholder="kg, 2kg, piece..." class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white" />
        </div>
      </div>
      <p id="price-preview" class="text-xs text-gray-500 -mt-2"></p>

      <div>
        <label for="f-desc" class="block text-sm font-semibold mb-1">Description</label>
        <textarea id="f-desc" rows="3" maxlength="300" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base focus:outline-none focus:border-rose bg-white"></textarea>
      </div>

      <label class="flex items-center gap-3 text-sm font-semibold">
        <input id="f-available" type="checkbox" class="w-5 h-5 accent-rose" checked />
        Available to order (untick to show &ldquo;Sold Out&rdquo;)
      </label>

      <p id="editor-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2"></p>

      <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-2.5 pt-1">
        <button id="delete-btn" type="button" class="hidden text-sm font-semibold text-red-600 hover:bg-red-50 px-4 py-2.5 rounded-xl transition">Delete cake</button>
        <div class="flex gap-2.5 sm:ml-auto">
          <button id="cancel-btn" type="button" class="flex-1 sm:flex-none px-5 py-3 rounded-xl border border-gray-300 font-semibold hover:bg-gray-50 transition">Cancel</button>
          <button id="save-btn" type="submit" class="flex-1 sm:flex-none px-6 py-3 rounded-xl bg-rose hover:bg-pink-700 text-white font-bold shadow transition disabled:opacity-60">Save</button>
        </div>
      </div>
    </form>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-cocoa text-white text-sm font-medium px-5 py-3 rounded-2xl shadow-2xl transition duration-300 opacity-0 pointer-events-none"></div>

  <script src="supabase-config.js" charset="UTF-8"></script>
  <script charset="UTF-8">
    const SB_URL = window.SUPABASE.url;
    const SB_KEY = window.SUPABASE.key;
    const BUCKET = "cake-photos";
    const SESSION_KEY = "esai_admin_session";
    // Category name -> code prefix for new cake IDs (WC01, KB02, ...). Names must match the website's filter tabs.
    const CATEGORIES = [
      ["Wedding Cakes", "WC"],
      ["Kids' Birthday", "KB"],
      ["Eggless", "EG"],
      ["Photo Cakes", "PC"],
      ["Brownies/Cupcakes", "BC"]
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const rupees = (n) => "₹" + Number(n).toLocaleString("en-IN");

    let session = null;
    let cakes = [];
    let editing = null;     // cake being edited, or null when adding
    let photoBlob = null;   // newly chosen (already resized) photo
    let previewUrl = null;

    /* ---------- session & API ---------- */
    function readSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
    }
    function storeSession(s) {
      try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }
    function toSession(d) {
      return {
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + Math.max(30, (d.expires_in || 3600) - 30) * 1000
      };
    }
    async function authToken(grant, body) {
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {
        method: "POST",
        headers: { apikey: SB_KEY, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        const msg = d.error_description || d.msg || d.message || "";
        throw new Error(/invalid login/i.test(msg) ? "Wrong email or password." : (msg || "Could not sign in. Please try again."));
      }
      return toSession(d);
    }
    async function accessToken() {
      if (!session) throw new Error("Please sign in again.");
      if (Date.now() >= session.expires_at) {
        try {
          session = await authToken("refresh_token", { refresh_token: session.refresh_token });
          storeSession(session);
        } catch (e) {
          showLogin("Your session ended. Please sign in again.");
          throw new Error("Your session ended. Please sign in again.");
        }
      }
      return session.access_token;
    }
    async function api(path, { method = "GET", json, blob, headers = {} } = {}) {
      const token = await accessToken();
      const h = { apikey: SB_KEY, Authorization: `Bearer ${token}`, ...headers };
      let body;
      if (json !== undefined) { h["Content-Type"] = "application/json"; body = JSON.stringify(json); }
      if (blob) { h["Content-Type"] = blob.type; body = blob; }
      const r = await fetch(`${SB_URL}${path}`, { method, headers: h, body });
      if (!r.ok) {
        let msg = "Something went wrong (" + r.status + ").";
        try { const d = await r.json(); msg = d.message || d.error || msg; } catch (e) {}
        throw new Error(msg);
      }
      if (r.status === 204) return null;
      return r.json().catch(() => null);
    }

    /* ---------- views ---------- */
    function showLogin(message) {
      session = null;
      storeSession(null);
      $("app-view").classList.add("hidden");
      $("login-view").classList.remove("hidden");
      const err = $("login-error");
      err.textContent = message || "";
      err.classList.toggle("hidden", !message);
    }
    async function showApp() {
      $("login-view").classList.add("hidden");
      $("app-view").classList.remove("hidden");
      await loadCakes();
    }
    let toastTimer;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.remove("opacity-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add("opacity-0"), 2600);
    }

    /* ---------- cake list ---------- */
    async function loadCakes() {
      $("list-status").textContent = "Loading cakes...";
      try {
        cakes = await api("/rest/v1/cakes?select=*&order=sort_order.asc,id.asc");
        renderList();
      } catch (e) {
        $("list-status").textContent = "Could not load cakes: " + e.message;
      }
    }
    function renderList() {
      const q = $("search").value.trim().toLowerCase();
      const cat = $("filter-category").value;
      const rows = cakes.filter((c) =>
        (!cat || c.category === cat) &&
        (!q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q))
      );
      $("list-status").textContent = `${rows.length} of ${cakes.length} cakes`;
      $("cake-list").innerHTML = rows.map((c) => `
        <li class="bg-white border border-pink-100 rounded-2xl shadow-sm p-3 flex items-center gap-3">
          <img src="${esc(c.image)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='images/logo.png'" class="w-16 h-16 rounded-xl object-cover bg-pink-50 border border-pink-100 shrink-0" />
          <div class="min-w-0 flex-1">
            <p class="font-bold text-sm leading-snug truncate">${esc(c.name)}</p>
            <p class="text-xs text-gray-500 truncate">#${esc(c.id)} &bull; ${esc(c.category)}</p>
            <p class="text-sm font-black text-rose">${esc(c.price)}</p>
          </div>
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <button type="button" data-act="toggle" data-id="${esc(c.id)}" class="text-xs font-bold px-2.5 py-1 rounded-full border ${c.available ? "bg-green-50 text-green-700 border-green-200" : "bg-red-50 text-red-600 border-red-200"}">${c.available ? "Available" : "Sold out"}</button>
            <button type="button" data-act="edit" data-id="${esc(c.id)}" class="text-xs font-bold px-3 py-1 rounded-full bg-cocoa text-white">Edit</button>
          </div>
        </li>`).join("") || `<li class="text-center text-gray-500 py-10">No cakes found.</li>`;
    }
    $("cake-list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const cake = cakes.find((c) => c.id === btn.dataset.id);
      if (!cake) return;
      if (btn.dataset.act === "edit") return openEditor(cake);
      btn.disabled = true;
      try {
        await api(`/rest/v1/cakes?id=eq.${encodeURIComponent(cake.id)}`, { method: "PATCH", json: { available: !cake.available }, headers: { Prefer: "return=minimal" } });
        cake.available = !cake.available;
        toast(cake.available ? "Marked available" : "Marked sold out");
      } catch (err) { toast(err.message); }
      renderList();
    });
    $("search").addEventListener("input", renderList);
    $("filter-category").addEventListener("change", renderList);

    /* ---------- editor ---------- */
    function priceParts(label) {
      const m = String(label || "").match(/\/\s*(.+)$/);
      return m ? m[1].trim() : "";
    }
    function buildLabel() {
      const n = Math.round(Number($("f-price").value));
      const unit = $("f-unit").value.trim();
      return n > 0 ? rupees(n) + (unit ? " / " + unit : "") : "";
    }
    function updatePricePreview() {
      const l = buildLabel();
      $("price-preview").textContent = l ? "Customers will see: " + l : "";
    }
    function setPreview(src) {
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
      $("photo-preview").src = src || "images/logo.png";
    }
    function openEditor(cake) {
      editing = cake || null;
      photoBlob = null;
      $("editor-title").textContent = cake ? "Edit cake" : "Add a new cake";
      $("f-name").value = cake ? cake.name : "";
      $("f-category").value = cake ? cake.category : CATEGORIES[0][0];
      $("f-price").value = cake ? cake.numeric_price : "";
      $("f-unit").value = cake ? priceParts(cake.price) : "kg";
      $("f-desc").value = cake ? cake.description : "";
      $("f-available").checked = cake ? cake.available : true;
      $("photo-input").value = "";
      $("photo-hint").textContent = "Square photos look best. Large photos are shrunk automatically.";
      setPreview(cake ? cake.image : "");
      $("delete-btn").classList.toggle("hidden", !cake);
      $("editor-error").classList.add("hidden");
      $("save-btn").disabled = false;
      updatePricePreview();
      $("editor").classList.remove("hidden");
      document.body.classList.add("overflow-hidden");
    }
    function closeEditor() {
      $("editor").classList.add("hidden");
      document.body.classList.remove("overflow-hidden");
      setPreview("");
    }
    function editorError(msg) {
      const el = $("editor-error");
      el.textContent = msg;
      el.classList.remove("hidden");
    }
    $("add-btn").addEventListener("click", () => openEditor(null));
    $("editor-close").addEventListener("click", closeEditor);
    $("cancel-btn").addEventListener("click", closeEditor);
    $("editor").addEventListener("click", (e) => { if (e.target === $("editor")) closeEditor(); });
    $("f-price").addEventListener("input", updatePricePreview);
    $("f-unit").addEventListener("input", updatePricePreview);

    function resizeImage(file, max = 1000, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const src = URL.createObjectURL(file);
        img.onload = () => {
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * s);
          c.height = Math.round(img.height * s);
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          c.toBlob((b) => { URL.revokeObjectURL(src); b ? resolve(b) : reject(new Error("Could not process that photo.")); }, "image/jpeg", quality);
        };
        img.onerror = () => { URL.revokeObjectURL(src); reject(new Error("That file is not a photo this browser can read.")); };
        img.src = src;
      });
    }
    $("photo-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        photoBlob = await resizeImage(file);
        setPreview("");
        previewUrl = URL.createObjectURL(photoBlob);
        $("photo-preview").src = previewUrl;
        $("photo-hint").textContent = `New photo ready (${Math.round(photoBlob.size / 1024)} KB).`;
      } catch (err) {
        photoBlob = null;
        editorError(err.message);
      }
    });

    function nextId(category) {
      const prefix = (CATEGORIES.find((c) => c[0] === category) || ["", "CK"])[1];
      const max = cakes.reduce((m, c) => {
        const mt = c.id.match(new RegExp("^" + prefix + "(\\d+)$"));
        return mt ? Math.max(m, Number(mt[1])) : m;
      }, 0);
      return prefix + String(max + 1).padStart(2, "0");
    }
    function storagePath(url) {
      const marker = `/storage/v1/object/public/${BUCKET}/`;
      const i = String(url || "").indexOf(marker);
      return i === -1 ? null : url.slice(i + marker.length);
    }
    async function removePhoto(url) {
      const p = storagePath(url);
      if (!p) return;
      try { await api(`/storage/v1/object/${BUCKET}/${p}`, { method: "DELETE" }); } catch (e) { /* old photo cleanup is best effort */ }
    }

    $("cake-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("editor-error").classList.add("hidden");
      const name = $("f-name").value.trim();
      const category = $("f-category").value;
      const price = Math.round(Number($("f-price").value));
      if (!name) return editorError("Please enter the cake name.");
      if (!(price > 0)) return editorError("Please enter a price above 0.");
      if (!editing && !photoBlob) return editorError("Please choose a photo for the new cake.");

      $("save-btn").disabled = true;
      $("save-btn").textContent = "Saving...";
      try {
        const id = editing ? editing.id : nextId(category);
        let image = editing ? editing.image : "";
        const oldImage = image;
        if (photoBlob) {
          const path = `${id}-${Date.now()}.jpg`;
          await api(`/storage/v1/object/${BUCKET}/${path}`, { method: "POST", blob: photoBlob, headers: { "x-upsert": "false" } });
          image = `${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
        }
        const row = {
          name, category,
          price: buildLabel(),
          numeric_price: price,
          description: $("f-desc").value.trim(),
          image,
          available: $("f-available").checked
        };
        if (editing) {
          await api(`/rest/v1/cakes?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", json: row, headers: { Prefer: "return=minimal" } });
          if (photoBlob) removePhoto(oldImage);
        } else {
          row.id = id;
          row.sort_order = cakes.reduce((m, c) => Math.max(m, c.sort_order || 0), 0) + 1;
          row.fallback_image = null;
          await api("/rest/v1/cakes", { method: "POST", json: row, headers: { Prefer: "return=minimal" } });
        }
        closeEditor();
        toast(editing ? "Saved" : `Added ${name}`);
        await loadCakes();
      } catch (err) {
        editorError(err.message);
      } finally {
        $("save-btn").disabled = false;
        $("save-btn").textContent = "Save";
      }
    });

    $("delete-btn").addEventListener("click", async () => {
      if (!editing) return;
      if (!confirm(`Delete "${editing.name}" permanently? This cannot be undone.`)) return;
      $("delete-btn").disabled = true;
      try {
        await api(`/rest/v1/cakes?id=eq.${encodeURIComponent(editing.id)}`, { method: "DELETE", headers: { Prefer: "return=minimal" } });
        removePhoto(editing.image);
        closeEditor();
        toast("Cake deleted");
        await loadCakes();
      } catch (err) {
        editorError(err.message);
      } finally {
        $("delete-btn").disabled = false;
      }
    });

    /* ---------- sign in / out ---------- */
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in...";
      $("login-error").classList.add("hidden");
      try {
        session = await authToken("password", { email: $("login-email").value.trim(), password: $("login-password").value });
        storeSession(session);
        $("login-password").value = "";
        await showApp();
      } catch (err) {
        showLogin(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
    $("logout-btn").addEventListener("click", () => showLogin(""));

    /* ---------- start ---------- */
    (function init() {
      const catOptions = CATEGORIES.map((c) => `<option value="${esc(c[0])}">${esc(c[0])}</option>`).join("");
      $("f-category").innerHTML = catOptions;
      $("filter-category").innerHTML = `<option value="">All categories</option>` + catOptions;
      session = readSession();
      if (session && session.refresh_token) showApp(); else showLogin("");
    })();
  </script>
</body>
</html>
